[package]
name = "pitchforge"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Fundamental-frequency (f0) estimation for monophonic audio with YIN, explicit voicing and diagnostics."
license = "MIT OR Apache-2.0"
repository = "https://github.com/MansourAZ0/pitchforge-rs"
readme = "README.md"
keywords = ["pitch", "dsp", "audio", "yin", "f0"]
categories = ["multimedia::audio", "science"]
exclude = ["/.github"]

[features]
default = ["fft"]
## Deterministic synthetic test-signal generators (sine, harmonic, pluck, vibrato, glide, noise).
signals = []
## O(N log N) YIN difference function using `realfft` (enabled by default).
fft = ["dep:realfft"]

[dependencies]
realfft = { version = "3.5", optional = true }

[dev-dependencies]
criterion = "0.8"
hound = "3.5"

[[test]]
name = "yin_accuracy"
required-features = ["signals"]

[[bench]]
name = "detectors"
harness = false
required-features = ["signals", "fft"]

[[example]]
name = "basic"
required-features = ["signals"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
