[package]
name = "pitchforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fundamental-frequency (f0) estimation for monophonic audio: YIN and McLeod pitch detectors with diagnostics."
license = "MIT OR Apache-2.0"
repository = "https://github.com/MansourAZ0/pitchforge-rs"
readme = "README.md"
keywords = ["pitch", "dsp", "audio", "yin", "f0"]
categories = ["multimedia::audio", "science"]
exclude = ["/.github"]

[features]
default = []
## Deterministic synthetic test-signal generators (sine, harmonic, pluck, vibrato, glide, noise).
signals = []

[dependencies]

[dev-dependencies]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
